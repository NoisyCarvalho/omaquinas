<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · Máquinas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141413">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: dark; --bg:#141413; --panel:#1f1f1e; --fg:#f2f2ee; --mut:#a2a29b; --line:#363633; --acc:#6ea0ff; --acc-bg:#1b2741; --ok:#4ade80; --ok-bg:#14281b; --warn:#fbbf24; --warn-bg:#33270f; --bad:#f87171; --ic:#2b4fb8; --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); }
.xs { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.xt { border-collapse: collapse; font: 13px Arial, sans-serif; color: #000; background: #fff; }
.xt td { padding: 3px 8px; border: 1px solid #ccc; white-space: nowrap; text-align: center; font-variant-numeric: tabular-nums; }
.xt td.n { text-align: left; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
main { max-width: 1040px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 130px max(16px, env(safe-area-inset-left)); }
svg { display: block; }
button { font: inherit; font-weight: 600; font-size: 1rem; min-height: 52px; padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; transition: transform .12s, box-shadow .15s, background .15s; }
button:active { transform: scale(.97); }
button.p { background: var(--acc); border-color: var(--acc); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 35%, transparent); }
button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
button.bad { color: var(--bad); }
button.l { min-height: 0; padding: 8px 4px; border: 0; background: none; color: var(--mut); font-weight: 500; font-size: .92rem; text-decoration: underline; }
button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
[hidden] { display: none !important; }
body.travado main, body.travado .tabs { display: none !important; }
.trava { position: fixed; inset: 0; z-index: 28; background: var(--bg); display: grid; place-items: center; padding: 20px; }
.tbox { width: min(400px, 100%); background: var(--panel); border-radius: 24px; padding: 24px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 12px; animation: entra .35s ease-out; }
.tbox .tile { width: 56px; height: 56px; border-radius: 16px; }
.tbox .tile svg { width: 30px; height: 30px; }
.tbox h2 { margin: 4px 0 0; }
.tbox p { margin: 0; }
.tmsg { min-height: 1.3em; color: var(--bad); font-size: .92rem; text-align: center; }
.topdir { display: flex; gap: 8px; align-items: center; }
.lockbtn { padding: 0; width: 44px; justify-content: center; }
.lockbtn svg { width: 22px; height: 22px; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
input { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-height: 50px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.mut { color: var(--mut); }

/* topo */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.7rem; margin: 0; line-height: 1.15; letter-spacing: -.01em; }
h1 span { color: var(--mut); font-weight: 600; }
.data { color: var(--mut); font-size: .95rem; margin-top: 4px; }
.data::first-letter { text-transform: uppercase; }
.opchip { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 14px 5px 5px; border-radius: 999px; font-size: .92rem; max-width: 46vw; }
.opchip i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #fff; font-style: normal; font-size: .85rem; flex: none; }
.opchip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#v { margin-top: 20px; }

/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kpi { background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 8px; }
.kpi .bub { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); }
.kpi.rua .bub { background: var(--acc-bg); color: var(--acc); }
.kpi.alerta .bub { background: var(--warn-bg); color: var(--warn); }
.kpi .bub svg { width: 22px; height: 22px; }
.kpi b { font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--mut); font-size: .88rem; }
.kpi.alerta.on { outline: 2px solid var(--warn); }

/* barra de ações */
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0 14px; }
.bar .p { flex: 1 1 220px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; font-size: 1.1rem; }
.bar .p svg { width: 26px; height: 26px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 8px 16px; border-radius: 999px; font-size: .95rem; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* máquinas */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.mq { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 14px; min-height: 164px; border-radius: 20px; border: 2px solid transparent; background: var(--panel); box-shadow: var(--sh); font-weight: 500; }
.mq .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); margin-bottom: 4px; }
.mq .ic svg { width: 26px; height: 26px; }
.mq .n { position: absolute; top: 12px; right: 14px; font-size: 1.6rem; font-weight: 800; color: var(--line); font-variant-numeric: tabular-nums; }
.mq .nm { font-weight: 700; font-size: 1.02rem; }
.mq .st { display: flex; align-items: center; gap: 7px; font-size: .92rem; font-weight: 600; color: var(--ok); margin-top: auto; }
.mq .st i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.mq .who { font-size: .92rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mq .tm { font-size: .85rem; color: var(--mut); font-variant-numeric: tabular-nums; }
.mq.rua { border-color: color-mix(in srgb, var(--acc) 35%, transparent); }
.mq.rua .ic { background: var(--acc-bg); color: var(--acc); }
.mq.rua .st { color: var(--acc); }
.mq.alerta { border-color: var(--warn); }
.mq.alerta .ic { background: var(--warn-bg); color: var(--warn); }
.mq.alerta .st, .mq.alerta .tm { color: var(--warn); }
.mq.alerta::after { content: ''; position: absolute; inset: -2px; border-radius: 20px; border: 2px solid var(--warn); animation: pulso 2s ease-out infinite; pointer-events: none; }
.mq.flash { animation: pop .5s ease-out; }
.vazio { text-align: center; color: var(--mut); padding: 40px 12px; }

/* cartões e listas */
.card { background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: var(--sh); margin-bottom: 14px; }
.card h2 { font-size: 1.05rem; margin: 0 0 4px; }
.card > small { color: var(--mut); display: block; margin-bottom: 12px; }
.lin { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.lin:first-of-type { border-top: 0; }
.lin .tx { flex: 1; min-width: 0; }
.lin .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin .tx small { color: var(--mut); }
.lin button { min-height: 44px; padding: 8px 14px; }
.tile { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--acc-bg); color: var(--acc); flex: none; }
.tile svg { width: 22px; height: 22px; }
.tile.v { background: var(--ok-bg); color: var(--ok); }
.tile.t { background: var(--warn-bg); color: var(--warn); }
.pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--acc-bg); color: var(--acc); }
.pill.w { background: var(--warn-bg); color: var(--warn); }
.pill.o { background: var(--ok-bg); color: var(--ok); }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; margin-bottom: 14px; }
.seg button { flex: 1; min-height: 42px; border: 0; background: none; padding: 6px; }
.seg button.on { background: var(--panel); box-shadow: var(--sh); }
.dia { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.dia button { min-height: 46px; padding: 8px 16px; }
.dia b { flex: 1; text-align: center; font-size: 1rem; }
.sub { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

/* conferência */
.prog { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; font-variant-numeric: tabular-nums; }
.trilho { height: 10px; background: var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.trilho i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 10px; transition: width .35s cubic-bezier(.2,.8,.2,1); }
.sw { width: 66px; min-height: 40px; height: 40px; padding: 0; border-radius: 999px; background: var(--line); border: 0; position: relative; flex: none; transition: background .2s; }
.sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
.sw[aria-pressed="true"] { background: var(--ok); }
.sw[aria-pressed="true"]::after { transform: translateX(26px); }
.lin.fora { background: var(--warn-bg); margin: 0 -8px; padding: 12px 8px; border-radius: 14px; border-top: 0; }
.fim { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.fim .p, .fim .ok { flex: 1 1 220px; min-height: 58px; font-size: 1.05rem; }
.feita { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 18px; background: var(--ok-bg); color: var(--ok); font-weight: 600; margin-bottom: 14px; }
.feita svg { width: 34px; height: 34px; flex: none; }

/* etiquetas */
.etq { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.eti { background: #fff; color: #111; border-radius: 18px; padding: 14px; text-align: center; box-shadow: var(--sh); break-inside: avoid; }
.eti svg { width: 100%; height: auto; }
.eti b { display: block; font-size: 1.5rem; margin-top: 6px; letter-spacing: .02em; }
.eti small { color: #555; }

/* sheet, toast, scanner */
.bd { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; display: flex; align-items: flex-end; justify-content: center; }
.bd.on { opacity: 1; }
.sheet { background: var(--panel); width: min(580px, 100%); max-height: 88vh; max-height: 88dvh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 18px max(22px, calc(env(safe-area-inset-bottom) + 14px)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.85,.25,1); }
.bd.on .sheet { transform: none; }
.grip { width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 14px; }
.sh-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.sh-top .tile { width: 54px; height: 54px; border-radius: 16px; }
.sh-top .tile svg { width: 30px; height: 30px; }
.sh-top h3 { margin: 0; font-size: 1.25rem; }
.sheet .acoes { display: grid; gap: 10px; margin-top: 14px; }
.sheet .acoes button { min-height: 58px; }
.ents { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.ents button { min-height: 58px; padding: 10px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ents button.novo { border-style: dashed; color: var(--acc); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 98px); transform: translate(-50%, 20px); z-index: 25; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 10px 10px 10px 18px; display: flex; align-items: center; gap: 12px; max-width: min(92vw, 520px); opacity: 0; transition: opacity .2s, transform .25s; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast button { min-height: 40px; padding: 6px 14px; background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.scan { position: fixed; inset: 0; z-index: 40; background: #000; color: #fff; display: flex; flex-direction: column; animation: fade .2s; }
.scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan .mira { position: absolute; left: 50%; top: 44%; width: min(68vmin, 340px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 26px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
.scan .mira i { position: absolute; width: 44px; height: 44px; border: 5px solid #fff; transition: border-color .2s; }
.scan .mira i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 26px; }
.scan .mira i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 26px; }
.scan .mira i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 26px; }
.scan .mira i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 26px; }
.scan .mira u { position: absolute; left: 8%; right: 8%; height: 3px; border-radius: 3px; background: var(--acc); box-shadow: 0 0 16px var(--acc); animation: varre 1.8s ease-in-out infinite alternate; }
.scan.ok .mira i { border-color: var(--ok); }
.scan.ok .mira u { background: var(--ok); box-shadow: 0 0 16px var(--ok); animation: none; top: 50%; }
.scan .dica { position: absolute; left: 0; right: 0; top: calc(44% + min(34vmin, 170px) + 22px); text-align: center; font-weight: 600; padding: 0 20px; text-shadow: 0 1px 6px #000; }
.scan .rodape { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 16px 16px max(18px, env(safe-area-inset-bottom)); }
.scan .rodape button { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); backdrop-filter: blur(8px); }
.confete { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.confete i { position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px; animation: cai 1.5s ease-in forwards; }

/* barra de abas */
.tabs { position: fixed; z-index: 20; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); display: flex; gap: 4px; padding: 6px; border-radius: 24px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 34px rgba(0,0,0,.18); border: 1px solid var(--line); }
.tabs button { flex: 1; min-height: 58px; padding: 6px 4px; border: 0; background: none; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--mut); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { background: var(--acc-bg); color: var(--acc); }
.tabs button.on svg { animation: salta .45s ease-out; }

/* animações */
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes entra { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes pop { 0% { transform: scale(.94) } 55% { transform: scale(1.05) } 100% { transform: scale(1) } }
@keyframes pulso { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(1.07) } }
@keyframes varre { from { top: 6% } to { top: 92% } }
@keyframes salta { 0% { transform: translateY(0) } 40% { transform: translateY(-5px) } 100% { transform: none } }
@keyframes cai { 0% { transform: translate(0, 0) rotate(0); opacity: 1 } 100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0 } }
.anim > * { animation: entra .38s ease-out backwards; animation-delay: calc(var(--n, 0) * 55ms); }
.anim .mq { animation: entra .4s ease-out backwards; animation-delay: calc(var(--n, 0) * 28ms); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .confete { display: none; }
}

@media (max-width: 520px) {
  body { font-size: 16px; }
  h1 { font-size: 1.4rem; }
  .kpis { gap: 8px; }
  .kpi { padding: 12px; border-radius: 16px; }
  .kpi b { font-size: 1.8rem; }
  .grade { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mq { min-height: 150px; padding: 12px; }
}

/* impressão das etiquetas */
@media print {
  body { background: #fff; color: #000; }
  .eti { background: #fff !important; color: #000 !important; }
  .eti b, .eti small, .eti .cod { color: #000 !important; }
  main > .top, #tabs, .toast, .noprint { display: none !important; }
  main { padding: 0; max-width: none; }
  #v { margin: 0; }
  /* etiqueta pequena: ~38 mm de largura (QR ~34 mm), várias por folha */
  .etq { display: flex; flex-wrap: wrap; gap: 3mm; }
  .eti { box-shadow: none; border: 1px solid #999; width: 38mm; padding: 2mm !important; border-radius: 2mm; break-inside: avoid; text-align: center; }
  .eti svg { width: 100%; height: auto; display: block; }
  .eti b { font-size: 10pt; line-height: 1.1; margin-top: 1mm; display: block; }
  .eti small { font-size: 7pt; display: block; }
  .eti .cod { font-size: 6.5pt; margin-top: 0; }
  .eti .lig { display: none; }
  @page { margin: 8mm; }
  .anim > * { animation: none !important; }
}

.etq.gerencia { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.eti { position: relative; }
.eti .cod { display: block; font: 600 .8rem ui-monospace, Menlo, Consolas, monospace; color: #555; margin-top: 2px; letter-spacing: .08em; }
.eti .lig { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: #e7f6ec; color: #16a34a; }
.eti .lig.sem { background: #fdf1dc; color: #d97706; }
.eti .ac { display: flex; gap: 6px; margin-top: 10px; }
.eti .ac button { flex: 1; min-height: 40px; padding: 6px 8px; font-size: .85rem; background: #f4f4f1; color: #111; border: 1px solid #dcdcd6; }
.lista-maq { display: grid; gap: 8px; margin-top: 12px; max-height: 52vh; overflow: auto; }
.lista-maq button { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; text-align: left; }
.lista-maq small { color: var(--mut); }
.off { color: var(--bad); font-weight: 700; }
.eti .ck { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; min-height: 0; margin: 0; accent-color: #2563eb; cursor: pointer; }
.eti.sel { outline: 3px solid #2563eb; outline-offset: -3px; }
@media print { .eti .ck { display: none; } .eti.sel { outline: 0; } body[data-imp="sel"] .eti:not(.sel) { display: none !important; } }
@media print { .eti .ac { display: none; } }
.offline { display: flex; gap: 10px; align-items: center; padding: 12px 14px; margin-bottom: 14px; border-radius: 16px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: .95rem; }
.offline span:first-child svg, .offline > span svg { width: 22px; height: 22px; flex: none; }
.lemb { display: flex; align-items: center; gap: 10px; font-size: .95rem; cursor: pointer; }
.lemb input { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--acc); }
.ents button.on { border-color: var(--acc); color: var(--acc); background: var(--acc-bg); }
.busca { margin: 0 0 14px; }
.q-lado { display: none; }
.q-lado .card { margin-bottom: 0; }
@media (min-width: 1100px) {
  body[data-v="quadro"] main { max-width: 1480px; }
  .q2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .q-lado { display: block; position: sticky; top: 16px; max-height: calc(100vh - 140px); overflow: auto; border-radius: 20px; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div><h1 id="tit"></h1><div class="data" id="data"></div></div>
    <div class="topdir">
      <button class="opchip lockbtn" id="travabtn" type="button" aria-label="Sair"></button>
      <button class="opchip" id="opchip" type="button" aria-label="Trocar quem está despachando"></button>
    </div>
  </header>
  <section id="v"></section>
</main>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div class="toast" id="toast" role="status"></div>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  // QRErrorCorrectionLevel

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };
