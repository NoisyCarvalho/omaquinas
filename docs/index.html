<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotina da loja</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5C1426">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icone-192-v12.png">
<link rel="apple-touch-icon" href="icone-192-v12.png">
<style>
:root { --bg:#F5EEE2; --panel:#FFFBF4; --fg:#2E1B14; --mut:#7A6458; --line:#E0D3C1; --acc:#5C1426; --acc-t:#7A1626; --acc-bg:#F1DFDA; --ic:#5C1426; --ok:#2F6B3F; --ok-bg:#E4EFDF; --on-ok:#FFFFFF; --warn:#8F5210; --warn-bg:#F7E7CB; --bad:#A3201A; }
@media (prefers-color-scheme: dark) { :root { --bg:#1C100C; --panel:#2A1913; --fg:#F3E9DA; --mut:#BBA593; --line:#46302A; --acc:#A83247; --acc-t:#E58A98; --acc-bg:#3A1820; --ic:#6B1A2C; --ok:#7BCB8F; --ok-bg:#1B2E20; --on-ok:#0E2415; --warn:#E3B15C; --warn-bg:#33250F; --bad:#FF9A90; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (min-width: 700px) { body { font-size: 17px; } }
main { max-width: 880px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) max(48px, calc(env(safe-area-inset-bottom) + 24px)) max(16px, env(safe-area-inset-left)); }
h1 { font-size: 1.65rem; line-height: 1.2; letter-spacing: -.015em; margin: 0; font-weight: 700; }
h2 { font-size: 1.2rem; line-height: 1.25; letter-spacing: -.01em; margin: 0; font-weight: 700; }
button { font: inherit; font-weight: 600; font-size: 1rem; min-height: 52px; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; transition: transform .12s, background .15s; }
button:active { transform: scale(.98); }
button.p { background: var(--acc); border-color: var(--acc); color: #fff; }
button.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
button:disabled { opacity: .45; cursor: default; transform: none; }
button.l { min-height: 48px; padding: 10px 18px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 600; font-size: .95rem; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--acc-t); outline-offset: 2px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.msg { color: var(--mut); font-size: .95rem; margin: 12px 0; text-align: center; }
.msg.e { color: var(--bad); }

/* ---------- início ---------- */
.topo { display: flex; align-items: center; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 0 18px; }
.marca { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--ic); color: #fff; }
.marca svg { width: 24px; height: 24px; }
.topo .app { font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
.topo .data { display: block; font-size: .85rem; color: var(--mut); }
.data::first-letter { text-transform: uppercase; }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--mut); font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pill:empty { display: none; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.pill[data-s="pend"] { color: var(--warn); }
.pill[data-s="pend"]::before { background: var(--warn); }
.menu { display: grid; gap: 14px; margin: 16px 0 20px; }
@media (min-width: 760px) { .menu { grid-template-columns: 1fr 1fr; } }
.rot { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; color: var(--fg); text-decoration: none; }
.rot.agora { border-color: var(--acc-t); box-shadow: 0 0 0 1px var(--acc-t); }
.rot:active { background: var(--bg); }
.anel-w { position: relative; display: grid; place-items: center; width: 76px; height: 76px; }
.anel { position: absolute; inset: 0; width: 100%; height: 100%; }
.anel .trilho { fill: none; stroke: var(--line); stroke-width: 6; }
.anel .arco { fill: none; stroke: var(--acc-t); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1); }
.anel .arco.ok { stroke: var(--ok); }
.anel .arco.zero { opacity: 0; }
.anel-w b { position: relative; font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
.anel-w small { font-size: .8rem; color: var(--mut); font-weight: 600; }
.rot-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { padding: 3px 10px; border-radius: 999px; background: var(--acc); color: #fff; font-size: .75rem; font-weight: 700; }
.rot p { margin: 3px 0 0; color: var(--mut); font-size: .95rem; }
.st { display: block; margin-top: 8px; font-size: .9rem; font-weight: 600; color: var(--mut); }
.st.alerta { color: var(--warn); }
.st.ok { color: var(--ok); }
.seta { color: var(--mut); font-size: 1.7rem; line-height: 1; }
.foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.foot button.l { min-height: 56px; }
@media (max-width: 380px) { .foot { grid-template-columns: 1fr; } }

/* ---------- rotina: linha do tempo ---------- */
.voltar { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 14px; margin: max(12px, env(safe-area-inset-top)) 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 600; text-decoration: none; }
.voltar:active { transform: scale(.98); }
.cab-pag { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 14px; }
.cab { display: flex; align-items: center; gap: 14px; }
.cab .ic { display: grid; place-items: center; flex: none; width: 50px; height: 50px; border-radius: 14px; background: var(--ic); color: #fff; }
.cab .ic svg { width: 28px; height: 28px; }
.quem { display: block; margin-top: 2px; font-size: .9rem; color: var(--mut); }
.prog { margin-left: auto; font-size: 1.05rem; white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--acc-t); transition: width .45s ease, background .3s; }
.perm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 14px; }
.perm:empty { display: none; }
.perm small { flex: 1 1 220px; font-size: .95rem; }
.passos { list-style: none; margin: 6px 0 0; padding: 0; }
.passo { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding-bottom: 12px; }
.passo::before { content: ""; position: absolute; left: 19px; top: 64px; bottom: -20px; width: 2px; background: var(--line); }
.passo:last-child::before { display: none; }
.passo.ok::before { background: var(--ok); }
.no { position: relative; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; margin-top: 22px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); color: var(--mut); font-weight: 700; }
.no svg { width: 20px; height: 20px; }
.no path { stroke-dasharray: 24; stroke-dashoffset: 0; }
.passo.ok .no { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.item { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; width: 100%; min-height: 84px; padding: 10px 14px 10px 10px; text-align: left; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); font-weight: 500; }
.item.feito { border-color: var(--ok); }
.item .vis { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 12px; background: var(--ic); color: #fff; overflow: hidden; }
.item .vis > svg { width: 32px; height: 32px; }
.item .vis img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item.conf .vis { background: var(--ok-bg); color: var(--ok); }
.txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nome { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.est { font-size: .88rem; color: var(--mut); }
.item.feito .est { color: var(--warn); }
.item.conf .est { color: var(--ok); }
.acao { color: var(--acc-t); font-weight: 600; font-size: .9rem; }
.cam-ic { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--acc); color: #fff; }
.cam-ic svg { width: 22px; height: 22px; }
.pronto { margin-top: 8px; padding: 14px 16px; border-radius: 14px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.gestor { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
.gestor summary { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; color: var(--mut); font-weight: 600; list-style: none; }
.gestor summary::-webkit-details-marker { display: none; }
.gestor summary::after { content: "▾"; }
.gestor[open] summary::after { content: "▴"; }
.gestor summary.alerta { color: var(--warn); }
.gestor .row { justify-content: flex-start; padding: 0 16px 16px; }

/* ---------- câmera, foto e PIN ---------- */
.ov { position: fixed; inset: 0; z-index: 10; background: rgba(22,11,8,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); color: #fff; overflow-y: auto; animation: fade .2s ease-out; }
.ov video, .ov img { max-width: 100%; max-height: 64vh; max-height: 64dvh; border-radius: 16px; background: #000; }
.ov .tit { font-size: 1.1rem; font-weight: 600; text-align: center; max-width: 640px; }
.ov .box2 { background: var(--panel); color: var(--fg); border-radius: 18px; padding: 22px; width: min(92vw, 380px); display: flex; flex-direction: column; gap: 12px; }
.ov .box2 .row { justify-content: flex-start; }
.ov input { font: inherit; font-size: 1.5rem; letter-spacing: .4em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.shutter { width: 84px; height: 84px; min-height: 0; padding: 0; border-radius: 50%; background: #fff; color: #2E1B14; border: 5px solid rgba(255,255,255,.45); background-clip: padding-box; display: grid; place-items: center; }
.shutter svg { width: 36px; height: 36px; }
.ov .row { align-items: center; }

/* ---------- histórico ---------- */
.tit-hist { margin: 4px 0 16px; }
.hbox { display: flex; flex-direction: column; gap: 14px; max-width: 400px; margin: 8px auto 0; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.hbox .cab .ic { width: 44px; height: 44px; }
.hbox label { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; font-weight: 600; }
.hbox input, select { font: inherit; font-weight: 400; min-height: 46px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.hbox input { width: 100%; background: var(--bg); }
.hmsg { display: block; margin: 6px 0 12px; color: var(--mut); font-size: .92rem; }
.hmsg.e { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 16px; }
.kpi { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.kpi b { display: block; font-size: 1.7rem; line-height: 1.15; letter-spacing: -.02em; }
.kpi span { font-size: .85rem; color: var(--mut); }
.hbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.hbar button { min-height: 46px; padding: 8px 16px; }
.exporta { position: relative; margin-left: auto; }
.exporta summary { display: inline-flex; align-items: center; min-height: 46px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-weight: 600; cursor: pointer; list-style: none; }
.exporta summary::-webkit-details-marker { display: none; }
.exporta summary::after { content: "▾"; margin-left: 8px; color: var(--mut); }
.menu-exp { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; display: flex; flex-direction: column; min-width: 220px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 28px rgba(46,27,20,.18); }
.menu-exp button { min-height: 46px; border: 0; background: none; text-align: left; font-weight: 500; }
.menu-exp button:hover { background: var(--bg); }
.tabw { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
table.ht { border-collapse: collapse; width: 100%; font-size: .93rem; }
.ht th { padding: 12px 14px; text-align: left; font-size: .8rem; font-weight: 600; color: var(--mut); background: var(--bg); border-bottom: 1px solid var(--line); }
.ht td { padding: 13px 14px; vertical-align: top; border-bottom: 1px solid var(--line); }
.ht tr:last-child td { border-bottom: 0; }
.ht tr.lin { cursor: pointer; }
.ht tr.lin:hover td { background: var(--bg); }
.ht td { white-space: nowrap; }
.ht td.f { min-width: 170px; white-space: normal; }
.tag-ok, .tag-no { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
.tag-ok { background: var(--ok-bg); color: var(--ok); }
.tag-no { background: var(--warn-bg); color: var(--warn); }
.ht tr.det td { background: var(--bg); font-size: .9rem; line-height: 1.7; white-space: pre-line; }

/* ---------- animação (só onde mostra o que mudou) ---------- */
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes entra { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes pop { 0% { transform: scale(.8) } 60% { transform: scale(1.12) } 100% { transform: scale(1) } }
@keyframes tracar { to { stroke-dashoffset: 0 } }
@keyframes cai { 0% { transform: translate(0, 0) rotate(0); opacity: 1 } 100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0 } }
.entra { animation: entra .22s ease-out; }
.passo.novo .no { animation: pop .45s ease-out; }
.passo.novo .no path { stroke-dashoffset: 24; animation: tracar .4s .12s ease-out forwards; }
.pronto:not([hidden]) { animation: entra .3s ease-out; }
.confete { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.confete i { position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px; animation: cai 1.5s ease-in forwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .confete { display: none; }
}

/* ---------- celular ---------- */
@media (max-width: 640px) {
  h1 { font-size: 1.4rem; }
  .rot { grid-template-columns: auto 1fr; }
  .seta { display: none; }
  .item { grid-template-columns: 56px 1fr auto; gap: 12px; }
  .item .vis { width: 56px; height: 56px; }
  .kpi { padding: 12px; }
  .kpi b { font-size: 1.35rem; }
  .row button:not(.shutter) { flex: 1 1 140px; }
  .exporta { margin-left: 0; }
  .menu-exp { left: 0; right: auto; }
  .ht tr.cab-t { display: none; }
  .ht, .ht tr { display: block; }
  .ht tr.lin { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .ht tr.lin td { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; border: 0; text-align: right; }
  .ht tr.lin td::before { content: attr(data-l); color: var(--mut); text-align: left; }
  .ht td, .ht td.f { white-space: normal; min-width: 0; }
  .ht tr.det { display: block; }
  .ht tr.det td { display: block; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .ov { flex-direction: row; flex-wrap: wrap; gap: 10px 18px; }
  .ov .tit { flex: 1 0 100%; font-size: 1rem; }
  .ov video, .ov img { max-height: 62dvh; max-width: 62vw; }
  .shutter { width: 68px; height: 68px; }
}
</style>
</head>
<body>
<main>
  <!-- Tela central -->
  <section id="home">
    <header class="topo">
      <span class="marca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4h6v3H9zM9 14.2l2.2 2.2 4.1-4.6"/></svg></span>
      <div><span class="app">Rotina da loja</span><span class="data" id="data"></span></div>
      <span class="pill" id="sync" aria-live="polite"></span>
    </header>
    <nav class="menu" id="menu" aria-label="Rotinas"></nav>
    <div class="foot"><button class="l" id="abrehist" type="button">Histórico</button><button class="l" id="trocapin" type="button">Alterar PIN</button></div>
  </section>

  <!-- Página de uma rotina -->
  <section id="pag" hidden>
    <a class="voltar" href="#">‹ Início</a>
    <div class="cab-pag">
      <div class="cab"><span class="ic" id="pag-ic" aria-hidden="true"></span><div><h1 id="titulo"></h1><span class="quem" id="quem"></span></div><b class="prog" id="prog"></b></div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    </div>
    <div class="perm" id="perm"></div>
    <ol class="passos" id="grade"></ol>
    <div class="pronto" id="pronto" hidden></div>
    <details class="gestor" id="gestor">
      <summary id="gestor-sum">Área do gestor</summary>
      <div class="row">
        <button class="p" id="conferir" type="button">Conferir e apagar as fotos</button>
        <button id="limpar" type="button">Limpar esta lista</button>
      </div>
    </details>
  </section>

  <!-- Histórico (só equipe, com login) -->
  <section id="hist" hidden>
    <a class="voltar" href="#" id="hist-voltar">‹ Início</a>
    <h1 class="tit-hist">Histórico das rotinas</h1>
    <form class="hbox" id="hist-login" hidden>
      <div class="cab"><span class="ic marca" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4h6v3H9zM9 14.2l2.2 2.2 4.1-4.6"/></svg></span><div><h2>Entrar</h2><span class="quem">Acesso da equipe</span></div></div>
      <label>E-mail<input id="h-email" type="email" autocomplete="username" required></label>
      <label>Senha<input id="h-senha" type="password" autocomplete="current-password" required></label>
      <button class="p" type="submit">Entrar</button>
      <small id="h-erro" class="hmsg"></small>
    </form>
    <div id="hist-dados" hidden>
      <div class="kpis" id="h-kpi"></div>
      <div class="hbar">
        <select id="h-per" aria-label="Período"><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select>
        <select id="h-rot" aria-label="Rotina"><option value="">Abertura e fechamento</option><option value="abertura">Só abertura</option><option value="fechamento">Só fechamento</option></select>
        <button id="h-atualiza" type="button">Atualizar</button>
        <details class="exporta" id="h-exp"><summary>Exportar CSV</summary>
          <div class="menu-exp">
            <button id="csv-dia" type="button">Resumo por dia</button>
            <button id="csv-itens" type="button">Itens por dia</button>
            <button id="csv-eventos" type="button">Todos os eventos</button>
          </div>
        </details>
        <button class="l" id="h-sair" type="button">Sair</button>
      </div>
      <small id="h-status" class="hmsg"></small>
      <div class="tabw"><table class="ht" id="h-tab"></table></div>
    </div>
  </section>

  <div class="msg" id="msg" role="status" hidden></div>
</main>

<script src="config.js"></script>
<script>
/* ============ ROTINAS (edite aqui) ============
   Cada rotina vira um botão na tela central e uma página.
   Todo item pede foto: o Rodrigo tira a foto e confirma; o gestor confere com o PIN e as fotos são apagadas.
   i = ícone do item, t = texto do item. */
const ROTINAS = {
  abertura: {
    titulo: 'Abertura Loja · Logística', icone: 'sol', resumo: 'Montar a área dos entregadores', quem: 'Rodrigo',
    itens: [
      { i: 'cone', c: 'cones', t: 'Posicionar os cones no estacionamento' },
      { i: 'lixo', c: 'lixo', t: 'Colocar a sacola de lixo na árvore dos entregadores' },
      { i: 'cafe', c: 'cafe', t: 'Colocar a garrafa de café' },
      { i: 'acucar', c: 'acucar', t: 'Colocar o açúcar com a colher' },
      { i: 'copo', c: 'copos', t: 'Colocar os copos descartáveis' }
    ]
  },
  fechamento: {
    titulo: 'Fechamento Loja · Logística', icone: 'lua', resumo: 'Guardar tudo no fim da noite', quem: 'Rodrigo',
    itens: [
      { i: 'cone', c: 'cones', t: 'Recolher os cones do estacionamento' },

/* ---- metadados EXIF (data, hora e passo) gravados dentro do JPEG ---- */
const agoraSP = () => {   // data/hora de São Paulo
  const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { o[x.type] = x.value; });
  return `${o.year}:${o.month}:${o.day} ${o.hour}:${o.minute}:${o.second}`;

const ascii = (t) => t.replace(/·/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '?');
function comExif(dataUrl, descricao) {
  const bin = atob(dataUrl.split(',')[1]), jpg = Uint8Array.from(bin, c => c.charCodeAt(0));
  const dt = agoraSP() + '\0', desc = ascii(descricao) + '\0';
  const tiff = new Uint8Array(140 + desc.length), v = new DataView(tiff.buffer);
  tiff.set([0x4d, 0x4d, 0, 0x2a], 0); v.setUint32(4, 8);                 // cabeçalho TIFF (big-endian)
  const ent = (o, tag, n, off) => { v.setUint16(o, tag); v.setUint16(o + 2, 2); v.setUint32(o + 4, n); v.setUint32(o + 8, off); };
  v.setUint16(8, 3);                                                     // IFD0: 3 campos
  ent(10, 0x010e, desc.length, 140);                                      // descrição
  ent(22, 0x0132, 20, 80);                                                // data/hora
  v.setUint16(34, 0x8769); v.setUint16(36, 4); v.setUint32(38, 1); v.setUint32(42, 50);  // ponteiro p/ Exif
  v.setUint32(46, 0);
  v.setUint16(50, 2);                                                    // Exif IFD: 2 campos
  ent(52, 0x9003, 20, 100); ent(64, 0x9004, 20, 120); v.setUint32(76, 0);
  [...dt].forEach((c, i) => { tiff[80 + i] = tiff[100 + i] = tiff[120 + i] = c.charCodeAt(0); });
  [...desc].forEach((c, i) => { tiff[140 + i] = c.charCodeAt(0); });
  const cab = [0x45, 0x78, 0x69, 0x66, 0, 0], len = 2 + cab.length + tiff.length;
  const app1 = new Uint8Array(2 + len); app1.set([0xff, 0xe1, len >> 8, len & 255], 0); app1.set(cab, 4); app1.set(tiff, 4 + cab.length);
  let pos = 2;                                                           // depois do SOI (e do JFIF, se houver)
  if (jpg[2] === 0xff && jpg[3] === 0xe0) pos = 4 + ((jpg[4] << 8) | jpg[5]);
  const out = new Uint8Array(jpg.length + app1.length); out.set(jpg.subarray(0, pos), 0); out.set(app1, pos); out.set(jpg.subarray(pos), pos + app1.length);
  let s2 = ''; for (let i = 0; i < out.length; i += 8192) s2 += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
  return 'data:image/jpeg;base64,' + btoa(s2);
}

/* foto -> JPEG pequeno */
const reduzir = (fonte, descricao) => new Promise((ok, erro) => {
  const img = new Image(), url = URL.createObjectURL(fonte);
  img.onload = () => {
    let m = 800, q = .7, out = '';
    for (let n = 0; n < 4; n++) {
      const r = Math.min(1, m / Math.max(img.width, img.height)), c = el('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 200000) break;
      m *= .75; q -= .1;
    }
    URL.revokeObjectURL(url);
    try { out = comExif(out, descricao); } catch (e) { /* sem EXIF, mantém a foto */ }
    ok(out);
  };
  img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('img')); };
  img.src = url;
});

  ITENS[pg].forEach((it, n) => {
    const e = est.s[it.k], feito = e && e.estado === 'feito', conf = e && e.estado === 'ok', ok = feito || conf;
    const li = el('li', 'passo' + (ok ? ' ok' : '') + (it.k === novoK ? ' novo' : ''));

    const txt = el('span', 'txt'); txt.append(el('span', 'nome', it.t), el('span', 'est', conf ? 'Conferido pelo gestor' : feito ? `Foto às ${hhmm(e.em)} · aguardando conferência` : 'Falta a foto'));

}

  m.dataset.s = fila.length ? 'pend' : 'ok';
};
let enviando = false;
const sincroniza = async () => {
  if (!CFG || enviando || !fila.length || navigator.onLine === false) { atualizaSync(); return; }
  enviando = true;
  try {
    while (fila.length) {
      const lote = fila.slice(0, 50);
      const r = await fetch(CFG.url + '/rest/v1/rpc/rotina_registrar', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.anonKey }, body: JSON.stringify({ p_eventos: lote }) });
      if (!r.ok) break;
      const j = await r.json();
      if (!j || j.ok !== true) break;
      if (j.rejeitados && j.rejeitados.length) console.warn('histórico: eventos recusados pelo servidor', j.rejeitados);
      const sai = new Set([...(j.aceitos || []), ...(j.rejeitados || [])]);
      const antes = fila.length; fila = fila.filter(x => !sai.has(x.id));
      salvaFila();
      if (fila.length === antes) break;          // sem progresso: tenta de novo mais tarde
    }
  } catch (e) { /* sem internet: fica na fila */ }
  enviando = false; atualizaSync();
};
const registra = (tipo, pg, it) => {
  fila.push({ id: uuid(), tipo, rotina: pg, item: it ? it.cod : null, em: new Date().toISOString(), disp, resp: tipo === 'item_feito' ? ROTINAS[pg].quem : 'gestor' });
  salvaFila(); atualizaSync(); sincroniza();
};
window.addEventListener('online', sincroniza);
setInterval(sincroniza, 60000);

/* ============ tela de histórico (só equipe: login do Supabase) ============ */
const SK = 'rotina-hist-tk';
let tk = null, histCarregado = false;
try { const o = JSON.parse(sessionStorage.getItem(SK)); if (o && o.exp > Date.now()) tk = o; } catch (e) {}
const sairHist = () => { tk = null; histCarregado = false; try { sessionStorage.removeItem(SK); } catch (e) {} };
const api = async (caminho, csv) => {
  const r = await fetch(CFG.url + caminho, { headers: Object.assign({ apikey: CFG.anonKey, Authorization: 'Bearer ' + tk.access }, csv ? { Accept: 'text/csv' } : {}) });
  if (r.status === 401) { sairHist(); throw new Error('sessao'); }
  if (!r.ok) throw new Error('http ' + r.status);
  return csv ? r.text() : r.json();
};
const desdeData = (dias) => { const d = new Date(hoje + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - dias); return d.toISOString().slice(0, 10); };
const filtro = () => { const rot = $('h-rot').value; return `data=gte.${desdeData(Number($('h-per').value))}` + (rot ? `&rotina=eq.${rot}` : ''); };
const hm = (iso) => iso ? iso.slice(11, 16) : '—';
const ddmm = (d) => d.slice(8, 10) + '/' + d.slice(5, 7);
const NOMES = { item_feito: 'feito', item_conferido: 'conferido pelo gestor', lista_limpa: 'lista limpa' };
const hmsg = (t, erro) => { const m = $('h-status'); m.textContent = t || ''; m.className = 'hmsg' + (erro ? ' e' : ''); };
function histMostra() {
  const ok = !!CFG;
  $('hist-login').hidden = !ok || !!tk; $('hist-dados').hidden = !ok || !tk;
  if (!ok) { $('h-erro').textContent = 'Histórico não configurado neste app.'; return; }
  if (tk && !histCarregado) histCarrega();
}
const kpi = (v, l) => { const k = el('div', 'kpi'); k.append(el('b', '', v), el('span', '', l)); return k; };
async function histCarrega() {
  histCarregado = true; hmsg('Carregando…');
  const T = $('h-tab'); T.textContent = ''; $('h-kpi').textContent = '';
  try {
    const linhas = await api('/rest/v1/rotina_v_dia?select=*&' + filtro() + '&order=data.desc,rotina.asc');
    const dias = new Set(linhas.map(l => l.data)).size;
    hmsg(linhas.length ? `${dias} dia(s) com registro · toque numa linha para ver os horários` : 'Nenhum registro neste período (ou a conta não é da equipe).');
    if (!linhas.length) return;
    const comp = linhas.filter(l => l.completo).length, conf = linhas.filter(l => l.conferido_em_sp).length, dur = linhas.filter(l => l.duracao_min != null).map(l => Number(l.duracao_min));
    $('h-kpi').append(kpi(Math.round(100 * comp / linhas.length) + '%', 'rotinas completas'), kpi(dur.length ? Math.round(dur.reduce((x, y) => x + y, 0) / dur.length) + ' min' : '—', 'duração média'), kpi(Math.round(100 * conf / linhas.length) + '%', 'conferidas pelo gestor'));
    const cab = el('tr', 'cab-t'); ['Data', 'Rotina', 'Feitos', 'Início → fim', 'Duração', 'Conferido', 'Faltaram'].forEach(t => cab.append(el('th', '', t))); T.append(cab);
    linhas.forEach(l => {
      const tr = el('tr', 'lin'), cel = (rot, cls, txt, node) => { const td = el('td', cls, node ? null : txt); td.dataset.l = rot; if (node) td.append(node); tr.append(td); };
      cel('Data', '', `${ddmm(l.data)} ${l.dia_semana.slice(0, 3)}`); cel('Rotina', '', l.rotina === 'abertura' ? 'Abertura' : 'Fechamento');
      cel('Feitos', '', '', el('span', l.completo ? 'tag-ok' : 'tag-no', `${l.itens_feitos}/${l.itens_total}`));
      cel('Início → fim', '', l.primeiro_item_sp ? `${hm(l.primeiro_item_sp)} → ${hm(l.ultimo_item_sp)}` : '—');
      cel('Duração', '', l.duracao_min != null ? l.duracao_min + ' min' : '—'); cel('Conferido', '', hm(l.conferido_em_sp)); cel('Faltaram', 'f', l.faltaram || '—');
      let aberto = null;
      tr.addEventListener('click', async () => {
        if (aberto) { aberto.remove(); aberto = null; return; }
        aberto = el('tr', 'det'); const td = el('td', '', 'Carregando…'); td.colSpan = 7; aberto.append(td); tr.after(aberto);
        try {
          const ev = await api(`/rest/v1/rotina_v_historico?select=hora_sp,tipo,item,responsavel,atraso_envio_s&data=eq.${l.data}&rotina=eq.${l.rotina}&order=ocorreu_em_sp.asc`);
          td.textContent = ev.map(x => `${x.hora_sp}  ${NOMES[x.tipo] || x.tipo}${x.item ? ' · ' + x.item : ''}${x.responsavel ? ' (' + x.responsavel + ')' : ''}${x.atraso_envio_s > 300 ? ' · enviado ' + Math.round(x.atraso_envio_s / 60) + ' min depois' : ''}`).join('\n');
        } catch (e) { td.textContent = 'Não foi possível carregar os horários.'; }
      });
      T.append(tr);
    });
  } catch (e) {
    if (e.message === 'sessao') { histMostra(); $('h-erro').textContent = 'Sessão expirada. Entre de novo.'; $('h-erro').className = 'hmsg e'; }
    else hmsg('Não foi possível carregar (sem internet?).', true);
  }
}
const baixaCsv = async (nome, caminho) => {
  $('h-exp').open = false;
  try {
    hmsg('Gerando arquivo…');
    const txt = await api(caminho, true);
    const a = el('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
    a.download = `rotina-${nome}-${hoje}.csv`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    hmsg('Arquivo baixado.');
  } catch (e) { if (e.message === 'sessao') histMostra(); else hmsg('Não foi possível gerar o arquivo.', true); }
};
$('csv-dia').addEventListener('click', () => baixaCsv('resumo-por-dia', '/rest/v1/rotina_v_dia?select=*&' + filtro() + '&order=data.desc,rotina.asc'));
$('csv-itens').addEventListener('click', () => baixaCsv('itens-por-dia', '/rest/v1/rotina_v_itens_dia?select=*&' + filtro() + '&order=data.desc,rotina.asc,item_ordem.asc'));
$('csv-eventos').addEventListener('click', () => baixaCsv('eventos', '/rest/v1/rotina_v_historico?select=*&' + filtro() + '&order=ocorreu_em_sp.desc'));
$('h-atualiza').addEventListener('click', histCarrega);
$('h-per').addEventListener('change', histCarrega); $('h-rot').addEventListener('change', histCarrega);
$('h-sair').addEventListener('click', () => { sairHist(); histMostra(); });
$('hist-voltar').addEventListener('click', ev => { ev.preventDefault(); ir(''); });
$('abrehist').addEventListener('click', () => ir('historico'));
$('hist-login').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const er = $('h-erro'); er.className = 'hmsg'; er.textContent = 'Entrando…';
  try {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('h-email').value.trim(), password: $('h-senha').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) throw new Error('login');
    tk = { access: j.access_token, exp: Date.now() + ((j.expires_in || 3600) - 60) * 1000 };
    try { sessionStorage.setItem(SK, JSON.stringify(tk)); } catch (e) {}
    $('h-senha').value = ''; er.textContent = ''; histCarregado = false; histMostra();
  } catch (e) { er.className = 'hmsg e'; er.textContent = 'E-mail ou senha incorretos (ou sem internet).'; }
});

/* ============ navegação ============ */
function render(rolar) {
  novoDia();
  const pg = pagina();
  const hist = pg === 'historico', rot = !!pg && !hist;
  $('home').hidden = !!pg; $('pag').hidden = !rot; $('hist').hidden = !hist;
  if (rot) { desenha(pg); atualizaPerm(pg); } else if (hist) { document.title = 'Histórico · Rotina da loja'; histMostra(); } else { document.title = 'Rotina da loja'; inicio(); }
  atualizaSync();
  if (rolar) { window.scrollTo(0, 0); $('gestor').open = false; anima(rot ? $('pag') : hist ? $('hist') : $('home')); }
}
window.addEventListener('hashchange', () => { atual = doHash(); aviso(''); render(true); });
document.querySelector('.voltar').addEventListener('click', ev => { ev.preventDefault(); ir(''); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(false); sincroniza(); } });

$('conferir').addEventListener('click', async () => {
  const pg = pagina(); if (!pg || !(await checaPin())) return;
  ITENS[pg].forEach(it => { const e = est.s[it.k]; if (e && e.estado === 'feito') { est.s[it.k] = { estado: 'ok', em: e.em }; registra('item_conferido', pg, it); } });  // a foto some junto
  salvar(); aviso('Conferido. As fotos foram apagadas.'); desenha(pg);
});
$('limpar').addEventListener('click', async () => {
  const pg = pagina(); if (!pg || !(await checaPin())) return;
  const havia = ITENS[pg].some(it => est.s[it.k]);
  ITENS[pg].forEach(it => { delete est.s[it.k]; }); salvar(); if (havia) registra('lista_limpa', pg, null); aviso('Lista limpa.'); desenha(pg);
});
$('trocapin').addEventListener('click', async () => {
  if (ler(PINKEY) && !(await checaPin())) return;
  const n = await pedirPin('Novo PIN do gestor', true); if (n) { gravarLS(PINKEY, await sha(n)); aviso('PIN alterado.'); }
});
if (!(() => { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch (e) { return false; } })()) aviso('Este navegador não guarda dados. Ao fechar a página, as marcações se perdem.', true);
render(true); sincroniza();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
